<section class="sec-main-news">
  <div class="container">
    <app-news-promo [newsItem]="newsService.topNewsInfo()"/>
  </div>
</section>

<section class="sec-news">
  <div class="container">
    <div class="news">
      <div class="news-cards">
        @for (news of newsService.newsInfos(); track $index) {
          <div class="news-cards__item">
            <app-news-item [newsItem]="news"/>
          </div>
        }
      </div>

      <div class="news__more">
        <a href="#" class="btn btn--ghost">Load more articles</a>
      </div>
    </div>
  </div>
</section>
