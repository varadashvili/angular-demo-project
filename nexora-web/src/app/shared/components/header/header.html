<header class="header">
  @if (errorServ.showErrorMsg()) {
    <div class="header__error" role="alert" animate.enter="header__error--enter" animate.leave="header__error--leave">
      <app-error-message [errorMsg]="errorServ.msg()"/>
    </div>
  }

  <div class="container">
    <div class="header__content">
      <a class="header__content__items" [routerLink]="['/']">
        <span class="header__content__logo">N</span>
        <div class="header__content__brand">
          <span>Nexora</span>
        </div>
      </a>
      <nav class="nav">
        <ul class="nav__list">
          <li class="nav__items">
            <a
              class="nav__link"
              [routerLink]="['/']"
              [class.is-active]="activePage() === 'main'">
              Home
            </a>
            <a
              class="nav__link"
              [routerLink]="['/about']"
              [class.is-active]="activePage() === 'about'">
              About
            </a>
            <a
              class="nav__link"
              [routerLink]="['/services']"
              [class.is-active]="activePage() === 'services'">
              Services
            </a>
            <a
              class="nav__link"
              [routerLink]="['/news']"
              [class.is-active]="activePage() === 'news'">
              News
            </a>
            @if (AuthService.isAuthenticated()) {
              <a
                class="nav__link"
                [routerLink]="['/profile']"
                [class.is-active]="activePage() === 'profile'">
                Profile
              </a>
            }
            <a
              class="nav__link"
              [routerLink]="['/contact']"
              [class.is-active]="activePage() === 'contact'">
              Contact
            </a>
          </li>
        </ul>
      </nav>
      @if (AuthService.isAuthenticated()) {
        <a class="btn btn--primary" (click)="logout()">Logout {{ AuthService.userInfo()?.username }}</a>
      } @else {
        <a class="btn btn--primary" (click)="AuthService.$showLoginPublisher.next(true)">Get Started</a>
      }
    </div>
  </div>
</header>
